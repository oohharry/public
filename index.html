
<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>幸运抽奖大屏</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#030610;color:#eaf4ff;font-family:"Microsoft YaHei",sans-serif;overflow:hidden}

/* ---------- 大屏端样式 ---------- */
#screen{height:100vh;display:flex;flex-direction:column;position:relative;z-index:10}
header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid rgba(90,170,255,.2);background:rgba(8,20,40,.7);backdrop-filter:blur(10px)}
.brand{font-size:32px;font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#00f2fe,#4facfe,#00f2fe);-webkit-background-clip:text;color:transparent;text-shadow:0 0 20px rgba(0,242,254,.4)}
.header-right{display:flex;align-items:center;gap:20px}
.count{font-size:18px;color:#bfe0ff}
.count span{font-size:36px;font-weight:bold;color:#fff;margin:0 5px;text-shadow:0 0 20px #00f2fe, 0 0 40px #00f2fe}
#showQrBtn{height:44px;padding:0 20px;border-radius:8px;background:linear-gradient(180deg,#00f2fe,#4facfe);color:#030610;font-size:16px;font-weight:bold;cursor:pointer;border:none;box-shadow:0 4px 15px rgba(0,242,254,.4);transition:.2s}
#showQrBtn:active{transform:scale(0.95)}
#settingBtn{height:36px;padding:0 15px;border:1px solid rgba(0,242,254,.5);border-radius:8px;background:rgba(0,242,254,.1);color:#00f2fe;font-size:14px;cursor:pointer;transition:.2s}
#settingBtn:hover{background:rgba(0,242,254,.2)}
#tipToast{position:fixed;top:84px;left:50%;transform:translateX(-50%);z-index:300;
background:rgba(8,20,40,.92);border:1px solid rgba(0,242,254,.5);color:#eaf4ff;
padding:10px 22px;border-radius:24px;font-size:15px;opacity:0;pointer-events:none;
transition:opacity .25s;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#tipToast.show{opacity:1}
#bgmBtn{height:36px;width:36px;border-radius:50%;border:1px solid rgba(0,242,254,.5);background:rgba(0,242,254,.1);color:#00f2fe;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}

main{flex:1;display:flex;min-height:0}
.left{width:280px;background:linear-gradient(180deg, rgba(8,20,40,.8), rgba(3,6,16,.9));padding:15px;border-right:1px solid rgba(90,170,255,.2);overflow-y:auto;backdrop-filter:blur(5px)}
.left::-webkit-scrollbar, .right::-webkit-scrollbar { display: none; }
.left, .right { -ms-overflow-style: none; scrollbar-width: none; }

.left h3{margin-bottom:15px;font-size:16px;text-align:center;color:#00f2fe;letter-spacing:2px;text-shadow:0 0 10px rgba(0,242,254,.5)}
.winner-item{background:linear-gradient(90deg,rgba(0,242,254,.15),rgba(10,20,40,.4));padding:10px;margin-bottom:8px;border-radius:6px;border-left:3px solid #00f2fe;display:flex;justify-content:space-between;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.3);animation: slideIn 0.3s ease-out;}
@keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.winner-item span{color:#8fb8e0}
.winner-item b{color:#ffd700;text-shadow:0 0 8px rgba(255,215,0,.5)}

.canvas-box{flex:1;position:relative;overflow:hidden;background:#030610}
canvas{display:block;width:100%;height:100%}

/* 右侧操作区 */
.right{width:280px;background:linear-gradient(180deg, rgba(8,20,40,.8), rgba(3,6,16,.9));padding:20px;border-left:1px solid rgba(90,170,255,.2);display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(5px)}
.prize-btn{padding:14px;border-radius:8px;border:1px solid rgba(0,242,254,.2);background:rgba(15,30,55,.7);cursor:pointer;text-align:center;font-size:16px;font-weight:bold;transition:.3s;position:relative;overflow:hidden}
.prize-btn:not(.done):hover{border-color:#00f2fe;box-shadow:0 0 15px rgba(0,242,254,.4)}
.prize-btn.active{border-color:#ffd700;background:rgba(60,50,10,.6);box-shadow:0 0 20px rgba(255,215,0,.4);color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,.5)}
.prize-btn.done{opacity:.2;cursor:not-allowed;filter:grayscale(1)}
.is-drawing .prize-btn { pointer-events: none; opacity: 0.5; }

.batch-row{display:flex;align-items:center;justify-content:space-between;font-size:15px;color:#bfe0ff;margin-top:10px;padding:10px 0;border-top:1px solid rgba(90,170,255,.2)}
.batch-row input{width:60px;height:34px;border-radius:6px;border:1px solid rgba(0,242,254,.3);background:#07111f;color:#00f2fe;font-size:18px;font-weight:bold;text-align:center;outline:none}
.controls{display:flex;flex-direction:column;gap:12px;margin-top:auto}
.controls button{height:56px;border:none;border-radius:10px;font-size:20px;font-weight:bold;cursor:pointer;transition:.2s;letter-spacing:2px}
#startBtn{background:linear-gradient(180deg,#00f2fe,#4facfe);color:#030610;box-shadow:0 0 20px rgba(0,242,254,.4)}
#startBtn:active{transform:scale(0.98)}
#stopBtn{background:linear-gradient(180deg,#ffb36b,#ff5e3d);color:#2a0500;box-shadow:0 0 20px rgba(255,94,61,.4)}
#stopBtn:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}

/* ---------- 放大二维码弹窗 ---------- */
#qrModal{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:200;cursor:pointer;backdrop-filter:blur(8px)}
.qr-container{background:#fff;padding:30px;border-radius:20px;box-shadow:0 0 100px rgba(0,242,254,.8);display:flex;flex-direction:column;align-items:center;animation:popIn .4s cubic-bezier(0.175, 0.885, 0.32, 1.275)}
@keyframes popIn{from{transform:scale(0.6);opacity:0}to{transform:scale(1);opacity:1}}
#bigQrcode img{width:360px;height:360px;display:block}
.qr-tips{margin-top:25px;font-size:28px;font-weight:900;color:#0f1a2e;letter-spacing:4px}
.qr-subtips{margin-top:40px;font-size:20px;color:#00f2fe;animation:blink 1.5s infinite;text-shadow:0 0 10px rgba(0,242,254,.5)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ---------- 手机登记页样式 ---------- */
#mobile{display:none;height:100vh;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 20%,#0a1c3a,#030610 70%)}
.card{width:100%;max-width:360px;background:rgba(15,26,46,.9);border:1px solid rgba(0,242,254,.3);border-radius:16px;padding:30px 20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 0 20px rgba(0,242,254,.1)}
.card h2{margin-bottom:10px;color:#00f2fe;font-size:24px;text-shadow:0 0 10px rgba(0,242,254,.4)}
.card p{color:#8fb8e0;font-size:14px;margin-bottom:25px}
.card input{width:100%;height:50px;margin-bottom:15px;border-radius:8px;border:1px solid rgba(0,242,254,.3);background:#030610;color:#fff;font-size:16px;padding:0 15px;outline:none;transition:.2s}
.card input:focus{border-color:#00f2fe;box-shadow:0 0 15px rgba(0,242,254,.3)}
.card button{width:100%;height:50px;border:none;border-radius:8px;background:linear-gradient(180deg,#00f2fe,#4facfe);color:#030610;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px}
.card button:disabled{opacity:.5}
#msg{margin-top:15px;font-size:14px;color:#00f2fe;min-height:20px}

/* ---------- 设置弹窗 ---------- */
#modalOverlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(5px)}
#modal{width:500px;max-width:90vw;background:#0f1a2e;border:1px solid rgba(0,242,254,.3);border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid rgba(0,242,254,.2)}
.modal-header h3{margin:0;color:#00f2fe;font-size:18px}
.close-btn{background:none;border:none;color:#8fb8e0;font-size:24px;cursor:pointer}
.prize-edit-row{display:flex;gap:10px;margin-bottom:10px;align-items:center}
.prize-edit-row input{height:38px;border-radius:6px;border:1px solid rgba(0,242,254,.3);background:#07111f;color:#fff;padding:0 10px;outline:none;font-size:14px}
.prize-edit-row .ename{flex:1}
.prize-edit-row .equota{width:80px}
.prize-edit-row .edel{width:38px;height:38px;border:none;border-radius:6px;background:rgba(255,94,61,.2);color:#ff5e3d;cursor:pointer;font-size:20px;line-height:1}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions button{flex:1;height:42px;border:none;border-radius:6px;cursor:pointer;font-size:15px;font-weight:bold}
#addPrizeBtn{background:rgba(0,242,254,.2);color:#00f2fe}
#savePrizesBtn{background:linear-gradient(180deg,#00f2fe,#4facfe);color:#030610}
#resetBtn{background:rgba(255,94,61,.2);color:#ff5e3d;margin-top:10px;width:100%;height:38px;border:none;border-radius:6px;cursor:pointer;font-size:14px}
/* ---- 名单管理（现场兜底录入 + 通道设置） ---- */
.sync-stat{font-size:12px;color:#7fa8cc;font-weight:normal;margin-left:10px;white-space:nowrap}
.sync-stat.bad{color:#ff5e3d}
.sync-stat.good{color:#41ffb0}
#rosterModal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:120;backdrop-filter:blur(5px)}
#rosterBox{width:900px;max-width:95vw;max-height:90vh;overflow:auto;background:#0f1a2e;border:1px solid rgba(0,242,254,.32);border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.85)}
#rosterBox h3{margin:0 0 4px 0;color:#00f2fe;font-size:18px}
#rosterStat{color:#9fc4e6;font-size:13px;margin-bottom:14px}
.rz-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.rz-grid{grid-template-columns:1fr}}
.rz-sec{border:1px solid rgba(0,242,254,.18);border-radius:12px;padding:14px}
.rz-sec h4{margin:0 0 10px 0;font-size:14px;color:#cfe8ff}
.rz-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.rz-row input,.rz-row textarea,.rz-row select{background:#07111f;border:1px solid rgba(0,242,254,.3);border-radius:6px;color:#fff;padding:8px 10px;outline:none;font-size:13px;font-family:inherit}
.rz-row input{height:38px}
#rz_one{flex:1;min-width:120px}
#rz_search{flex:1;min-width:120px}
#rz_bulk{width:100%;min-height:120px;resize:vertical;line-height:1.6}
.rz-btn{height:38px;padding:0 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold;background:rgba(0,242,254,.18);color:#00f2fe}
.rz-btn.primary{background:linear-gradient(180deg,#00f2fe,#4facfe);color:#030610}
.rz-btn.danger{background:rgba(255,94,61,.2);color:#ff5e3d}
#rz_list{max-height:320px;overflow:auto;border-top:1px solid rgba(0,242,254,.15);padding-top:8px}
.rz-item{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px dashed rgba(255,255,255,.06);font-size:13px;color:#dbeeff}
.rz-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rz-item .tag{font-size:11px;color:#8fb8e0;background:rgba(143,184,224,.12);border-radius:4px;padding:2px 6px;white-space:nowrap}
.rz-item .tag.won{color:#ffd700;background:rgba(255,215,0,.14)}
.rz-item .del{width:26px;height:26px;border:none;border-radius:5px;background:rgba(255,94,61,.18);color:#ff5e3d;cursor:pointer;font-size:15px;line-height:1}
.rz-tip{font-size:12px;color:#7fa8cc;line-height:1.7;margin-top:8px}
.rz-empty{color:#6f8fb0;font-size:13px;text-align:center;padding:22px 0}
</style>
</head>
<body>

<!-- 背景音乐 -->
<audio id="bgm" src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8a73467.mp3" loop></audio>

<!-- 大屏界面 -->
<div id="screen">
  <header>
    <div class="brand">LUCKY DRAW</div>
    <div class="header-right">
      <div class="count">已参与 <span id="totalCount">0</span> 人<span id="syncStat" class="sync-stat">同步初始化…</span></div>
      <button id="bgmBtn" title="背景音乐">🔊</button>
      <button id="showQrBtn">📱 扫码参与</button>
      <button id="rosterBtn">名单管理</button>
      <button id="settingBtn">⚙️ 设置奖项</button>
    </div>
  </header>
  <main>
    <div class="left">
      <h3>🏆 中奖名单</h3>
      <div id="winnerList"></div>
    </div>
    <div class="canvas-box">
      <canvas id="stage"></canvas>
    </div>
    <div class="right">
      <div id="prizeList"></div>
      <div class="batch-row">
        <span>本批揭晓</span>
        <input id="drawCount" type="number" value="1" min="1" max="50"> 人
      </div>
      <div class="controls">
        <button id="startBtn">开始抽奖</button>
        <button id="stopBtn" disabled>停止抽奖</button>
      </div>
    </div>
  </main>
</div>

<!-- 放大版二维码弹窗 -->
<div id="qrModal">
  <div class="qr-container">
    <div id="bigQrcode"></div>
    <div class="qr-tips" id="qrTips">微信/浏览器 扫码参与</div>
  </div>
  <div class="qr-subtips">点击屏幕任意位置关闭</div>
</div>

<!-- 手机登记界面 -->
<div id="mobile">
  <div class="card">
    <h2>活动登记</h2>
    <p>请输入您的姓名参与抽奖</p>
    <input id="m_name" placeholder="请输入姓名（必填）" maxlength="20" autocomplete="off">
    <button id="m_submit">提交登记</button>
    <p id="msg"></p>
  </div>
</div>

<!-- 设置奖项弹窗 -->
<div id="modalOverlay">
  <div id="modal">
    <div class="modal-header">
      <h3>⚙️ 奖项设置</h3>
      <button class="close-btn" id="closeModal">&times;</button>
    </div>
    <div id="prizeEditor"></div>
    <div class="modal-actions">
      <button id="addPrizeBtn">＋ 添加奖项</button>
      <button id="savePrizesBtn">保存并生效</button>
    </div>
    <button id="resetBtn">重置所有中奖状态（清空已抽数量）</button>
  </div>
</div>

<!-- 名单管理弹窗：现场兜底录入 + 同步通道设置 -->
<div id="rosterModal">
  <div id="rosterBox">
    <div class="modal-header">
      <h3>名单管理</h3>
      <button class="close-btn" id="rz_close">&times;</button>
    </div>
    <div id="rosterStat"></div>
    <div class="rz-grid">
      <div class="rz-sec">
        <h4>现场录入 / 批量导入（不依赖网络）</h4>
        <div class="rz-row">
          <input id="rz_one" placeholder="输入一个姓名">
          <button class="rz-btn primary" id="rz_addOne">添加</button>
        </div>
        <div class="rz-row"><textarea id="rz_bulk" placeholder="批量导入：每行一个姓名，可一次粘贴 600 行，重复姓名会自动编号区分"></textarea></div>
        <div class="rz-row">
          <button class="rz-btn primary" id="rz_import">导入名单</button>
          <button class="rz-btn" id="rz_copy">复制当前名单</button>
          <button class="rz-btn danger" id="rz_clear">清空名单</button>
        </div>
        <div class="rz-tip">扫码登记与现场录入可混用，人数无上限；导入后自动存入本机并参与抽奖。</div>
      </div>
      <div class="rz-sec">
        <h4>同步通道</h4>
        <div class="rz-row">
          <span style="font-size:13px;color:#9fc4e6">通道服务器</span>
          <input id="rz_server" placeholder="https://ntfy.sh" style="flex:1;min-width:160px">
        </div>
        <div class="rz-row">
          <span style="font-size:13px;color:#9fc4e6">并行子通道</span>
          <input id="rz_chsub" type="number" min="2" max="16" style="width:70px">
          <button class="rz-btn" id="rz_saveComm">保存并重连</button>
        </div>
        <div class="rz-tip" id="rz_commTip"></div>
        <h4 style="margin-top:14px">当前名单 <input id="rz_search" placeholder="搜索姓名" style="height:30px;font-size:12px"></h4>
        <div id="rz_list"></div>
      </div>
    </div>
  </div>
</div>

<div id="tipToast"></div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
// 全局轻提示与容量保障（登记人数超过当前槽位时自动扩容，无 240 上限）
function showTip(msg) {
  const t = document.getElementById('tipToast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__tipTimer);
  window.__tipTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function hashStr(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

// ======== 登记通道（本次修复的核心） ========
// 之前 600 人的登记全部挤在第三方公共推送服务（默认 ntfy.sh）的「同一条 topic」上。
// 免费公共服务对单条 topic 有缓存条数与频率限额（公开资料：约每小时两三百条量级），
// 集中扫码爬到 240 人左右就开始拒收/丢消息，加上原代码 fetch 不校验返回状态
// （被拒也提示“登记成功”）、只有一条不会补历史的 SSE 连接，于是表现为“人数卡在 240 不动”。
// 现在改成：一个房间拆成多条并行子通道摊薄限额；大屏同时订阅全部子通道；
// 每条通道按消息游标定期回补拉取，即使某条连接断开或某次推送错过也能补回；
// 手机端严格校验服务端返回，失败自动换通道重试并排队补发，绝不谎报成功。
const WIRE_SEP = ' ||| ';
let COMM = {
  server: 'https://ntfy.sh',
  base: '',
  subs: 12,
  es: [],
  lastId: [],
  chOk: [],
  pollOk: 0,
  lastSync: 0,
  pollTimer: null,
  seq: 0,
  started: false
};

function commSetup() {
  try {
    const sv = localStorage.getItem('lottery_comm_server');
    if (sv) COMM.server = sv.replace(/\/+$/, '');
    const cs = parseInt(localStorage.getItem('lottery_comm_subs'), 10);
    if (cs >= 2 && cs <= 16) COMM.subs = cs;
    if (!localStorage.getItem('lottery_comm_subs')) COMM.subs = 12;
  } catch (e) {}
  if (urlParams.get('srv')) COMM.server = decodeURIComponent(urlParams.get('srv')).replace(/\/+$/, '');
  const ch = parseInt(urlParams.get('ch'), 10);
  if (ch >= 2 && ch <= 16) COMM.subs = ch;
  if (!/^https?:\/\//.test(COMM.server)) COMM.server = 'https://ntfy.sh';
}
function subTopic(i) { return COMM.base + '_' + i; }
function topicSlot(key) {
  let h = 2166136261; const str = String(key == null ? Date.now() : key);
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return h % COMM.subs;
}
function newUid(prefix) {
  COMM.seq++;
  return (prefix || 'm') + '_' + Date.now().toString(36) + '_' + COMM.seq.toString(36) + '_' + hashStr(Math.random().toString(36));
}
function wireText(name, uid) { return name + WIRE_SEP + uid; }
function wireParse(raw) {
  const text = String(raw == null ? '' : raw).trim();
  if (!text) return null;
  const i = text.indexOf(WIRE_SEP);
  if (i < 0) return { name: text.slice(0, 20), uid: 'legacy_' + hashStr(text) };
  const nm = text.slice(0, i).trim();
  const uid = text.slice(i + WIRE_SEP.length).trim();
  if (!nm) return null;
  return { name: nm.slice(0, 20), uid: uid || ('legacy_' + hashStr(nm)) };
}
function stampSync() {
  COMM.lastSync = Date.now();
  renderSyncStat();
}
function renderSyncStat() {
  const el = document.getElementById('syncStat');
  if (!el) return;
  const live = COMM.chOk.filter(Boolean).length;
  const tm = COMM.lastSync ? new Date(COMM.lastSync).toLocaleTimeString('zh-CN', { hour12: false }) : '尚未同步';
  if (!COMM.started) { el.textContent = ''; el.className = 'sync-stat'; return; }
  if (live === 0) {
    el.textContent = '扫码通道未连接（可在“名单管理”现场录入，不受影响）';
    el.className = 'sync-stat bad';
  } else {
    el.textContent = '同步 ' + live + '/' + COMM.subs + ' 通道 · ' + tm;
    el.className = live >= COMM.subs ? 'sync-stat good' : 'sync-stat';
  }
}
function openSSE(i) {
  let es = null;
  const open = () => {
    try { es = new EventSource(COMM.server + '/' + subTopic(i) + '/sse'); } catch (e) { return; }
    if (!es) return;
    es.onopen = () => { COMM.chOk[i] = true; stampSync(); };
    es.onmessage = (ev) => {
      let d = null;
      try { d = JSON.parse(ev.data); } catch (e) { return; }
      if (d && d.event === 'message') {
        if (d.id) COMM.lastId[i] = d.id;
        const w = wireParse(d.message);
        if (w) onRemoteAdd(w);
        COMM.chOk[i] = true;
        stampSync();
      }
    };
    // 断线自动重连（带随机退避），重连后由回补拉取把断线期间漏掉的登记补回
    es.onerror = () => {
      COMM.chOk[i] = false;
      renderSyncStat();
      try { es.close(); } catch (e) {}
      setTimeout(open, 1500 + secureRandInt(2500));
    };
  };
  open();
  COMM.es[i] = es;
}
async function pollChannel(i) {
  const url = COMM.server + '/' + subTopic(i) + '/json?poll=1&since=' + encodeURIComponent(COMM.lastId[i] || 'all');
  try {
    let ctl = null, tm = null;
    if (typeof AbortController === 'function') { ctl = new AbortController(); tm = setTimeout(() => ctl.abort(), 9000); }
    const res = await fetch(url, ctl ? { signal: ctl.signal } : undefined);
    if (tm) clearTimeout(tm);
    if (!res.ok) return false;
    const txt = await res.text();
    let added = 0;
    for (const line of txt.split('\n')) {
      if (!line.trim()) continue;
      let d = null;
      try { d = JSON.parse(line); } catch (e) { continue; }
      if (d && d.id) COMM.lastId[i] = d.id;
      const w = wireParse(d && d.message);
      if (w && onRemoteAdd(w)) added++;
    }
    COMM.pollOk++;
    return true;
  } catch (e) { return false; }
}
function startPoller() {
  if (COMM.pollTimer) clearInterval(COMM.pollTimer);
  const run = async () => {
    for (let i = 0; i < COMM.subs; i++) {
      const ok = await pollChannel(i);
      if (ok) stampSync();
      await sleep(260);          // 各通道错峰，避免瞬时并发触发限额
    }
  };
  run();
  COMM.pollTimer = setInterval(run, 20000);
}
function startCommReceiver() {
  COMM.started = true;
  COMM.es = []; COMM.lastId = []; COMM.chOk = [];
  for (let i = 0; i < COMM.subs; i++) { COMM.es.push(null); COMM.lastId.push(''); COMM.chOk.push(false); }
  for (let i = 0; i < COMM.subs; i++) openSSE(i);
  startPoller();
  renderSyncStat();
}
function restartComm() {
  COMM.es.forEach(e => { try { if (e) e.close(); } catch (x) {} });
  if (COMM.pollTimer) clearInterval(COMM.pollTimer);
  COMM.pollTimer = null;
  startCommReceiver();
}

}

// 同名共存：按加入顺序自动编号（王芳 / 王芳·2 / 王芳·3），不再静默丢弃
function relabel() {

  const seen = {};
  for (const p of participants) {
    if (total[p.name] > 1) {

function addParticipant(name, uid, source) {

  const item = { uid: key, name: nm, disp: nm, won: false, src: source || 'scan', t: Date.now() };
  participants.push(item);

// ======== 高熵随机引擎（强化抽取随机性） ========
// 1) 随机源：优先使用浏览器密码学随机数 crypto.getRandomValues，
//    彻底摆脱 Math.random 的线性同余序列可预测问题；
// 2) 分布：拒绝采样消除“取模偏差”，保证每个人中签概率严格相等；
// 3) 算法：Fisher-Yates 全排列洗牌，多轮叠代 + 时间/动画熵混入，
//    使结果与点击时刻、名单顺序完全解耦。
let _entropy = 0;
function mixEntropy(v) {
  _entropy = (_entropy + Math.abs(Math.floor(v * 1024))) >>> 0;
}
function cryptoU32() {
  try {
    if (window.crypto && crypto.getRandomValues) {
      const a = new Uint32Array(1);
      crypto.getRandomValues(a);
      return a[0];
    }
  } catch (e) {}
  return Math.floor(Math.random() * 4294967296) >>> 0;
}
function secureRandInt(n) {           // [0, n) 内均匀分布，无偏
  if (n <= 1) return 0;
  const limit = Math.floor(4294967296 / n) * n;
  let x;
  do { x = cryptoU32(); } while (x >= limit);
  return (x % n) >>> 0;
}
function rf() { return secureRandInt(1000000) / 1000000; }  // [0,1) 均匀浮点
function shuffleStrong(arr) {         // Fisher-Yates 加密随机洗牌
  for (let i = arr.length - 1; i > 0; i--) {
    const j = secureRandInt(i + 1);
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function pickWinners(pool, batch) {
  mixEntropy(performance.now());
  const a = shuffleStrong(pool.slice());
  const rounds = 2 + secureRandInt(3);       // 2~4 轮额外洗牌，叠代次数本身也是随机的
  for (let r = 0; r < rounds; r++) shuffleStrong(a);
  mixEntropy(rf());
  const out = [];
  const rest = a.slice();
  for (let i = 0; i < batch && rest.length; i++) {
    const idx = secureRandInt(rest.length);   // 二次随机定位，消除顺序残留
    out.push(rest.splice(idx, 1)[0]);
  }
  return out;
}

  $('showQrBtn').onclick = () => $('qrModal').style.display = 'flex';
  $('qrModal').onclick = () => $('qrModal').style.display = 'none';

  // --- Canvas 引擎 ---
  const canvas = $('stage');
  const ctx = canvas.getContext('2d');
  let W, H, cx, cy, R, dpr;
  let rotY = 0, speed = 0.2, targetSpeed = 0.2;
  let slots = [], flyers = [], sparks = [], bgStars = [];
  let state = 'idle'; 
  let currentPrizeId = null;
  let centerWinners = []; 
  
  // —— 登记容量：默认预留 600 个球面姓名槽位，人数超出时自动扩容 ——
  const BASE_SLOTS = 600;   // 基础容量，支持至少 600 人同时登记
  let MAX = BASE_SLOTS;     // 当前实际槽位数（随登记人数动态增长）

  function ensureSlotCapacity() {
    const need = Math.max(BASE_SLOTS, participants.length + 60);
    if (need !== MAX) { MAX = need; initSlots(); }
  }

  function initSlots() {
    slots = [];
    for (let i = 0; i < MAX; i++) {
      const y = 1 - (i / (MAX - 1)) * 2;
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      const theta = Math.PI * (3 - Math.sqrt(5)) * i;
      slots.push({
        bx: Math.cos(theta) * r, by: y, bz: Math.sin(theta) * r,
        name: null, owner: null,
        seed: Math.random(),          // 每个光点独立的闪烁相位
        sx: 0, sy: 0, sz: 0, persp: 1 // 每帧缓存球面投影坐标，供“光点飞出”取起点
      });
    }
    bgStars = [];
    for(let i=0; i<100; i++) {
      bgStars.push({
        x: Math.random() * 2000, y: Math.random() * 2000,
        s: Math.random() * 1.5 + 0.5, a: Math.random() * 0.5 + 0.1,
        speed: Math.random() * 0.5 + 0.1
      });
    }
  }

  // ===== 光点 ↔ 人名 的映射规则 =====
  // 默认状态：整个球体全部由光点组成（不显示任何“等待登记”文字）。
  // 每来一位登记人员，就把球面上“一个”光点替换成他/她的名字；
  // 未登记到的槽位继续保留为光点，因此光点总数恒定、球体形状不变。
  function assignNamesToSlots(pool) {
    for (let i = 0; i < slots.length; i++) { slots[i].name = null; slots[i].owner = null; slots[i].used = false; }
    const n = Math.min(pool.length, slots.length);
    if (n <= 0) return;
    for (let k = 0; k < n; k++) {
      let idx = Math.floor(k * slots.length / n) % slots.length;  // 均匀散布在球面
      let guard = 0;
      while (slots[idx].name !== null && guard < slots.length) {  // 防撞位
        idx = (idx + 1) % slots.length; guard++;
      }
      slots[idx].name = pool[k].disp || pool[k].name;
      slots[idx].owner = pool[k];
    }
  }

  // 抽奖停止时，光点的飞行起点 = 该人员所占据的那个球面槽位的实时位置。
  // 球体一直在旋转，且每人对应不同槽位，因此起点每轮都不同，绝不会固定在同一处。
  // 按当前旋转角度实时算出某个槽位在屏幕上的位置（点击瞬间的真实位置）
  function slotScreen(s) {
    const cY = Math.cos(rotY), sY = Math.sin(rotY);
    const cX = Math.cos(-0.18), sX = Math.sin(-0.18);
    let x = s.bx * cY - s.bz * sY;
    let z = s.bx * sY + s.bz * cY;
    let y = s.by * cX - z * sX;
    z = s.by * sX + z * cX;
    const persp = 2.4 / (2.4 + z);
    return { x: cx + x * R * persp, y: cy + y * R * persp };
  }

  // 本轮已用过的起点（同一批多名中奖者时互相拉开距离，绝不从同一点飞出）
  let usedOrigins = [];
  function resetOrigins() { usedOrigins = []; }
  function farEnough(pt) {
    for (const u of usedOrigins) {
      if (Math.abs(u.x - pt.x) < 46 && Math.abs(u.y - pt.y) < 46) return false;
    }
    return true;
  }
  function slotOriginFor(p) {
    let pt = null;
    if (p) {
      for (const s of slots) {
        if (s.owner === p || (s.owner && p.uid && s.owner.uid === p.uid)) {
          s.name = null; s.owner = null;
          pt = slotScreen(s);
          break;
        }
      }
    }
    if (!pt) {
      // 兜底：该人员尚未渲染成槽位时，从空闲光点中随机取起点，并排除本轮已用过的槽位
      for (let attempt = 0; attempt < 12; attempt++) {
        const free = [];
        for (let i = 0; i < slots.length; i++) if (!slots[i].name && !slots[i].used) free.push(i);
        if (!free.length) break;
        const hit = slots[free[secureRandInt(free.length)]];
        hit.used = true;
        pt = slotScreen(hit);
        if (farEnough(pt)) break;
      }
    }
    if (!pt) pt = { x: cx + (rf() - 0.5) * W * 0.8, y: cy + (rf() - 0.5) * H * 0.8 };
    usedOrigins.push(pt);
    return pt;
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.scale(dpr, dpr);
    cx = W / 2; cy = H / 2; R = Math.min(W, H) * 0.38;
  }
  window.addEventListener('resize', resize);

  function createSparks(x, y, color = '#00f2fe') {
    for (let i = 0; i < 80; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = Math.random() * 10 + 3;
      sparks.push({
        x, y, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd,
        life: 1, decay: Math.random() * 0.02 + 0.015, color: color
      });
    }
  }

  function update(dt, now) {
    speed += (targetSpeed - speed) * Math.min(1, dt * 2.2);
    rotY += speed * dt;

    bgStars.forEach(s => {
      s.y -= s.speed;
      if (s.y < 0) { s.y = H; s.x = Math.random() * W; }
    });

    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.95; p.vy *= 0.95;
      p.life -= p.decay;
      if (p.life <= 0) sparks.splice(i, 1);
    }

    // 彗星飞行
    for (let i = flyers.length - 1; i >= 0; i--) {
      const f = flyers[i];
      if (now < f.startAt) continue;
      const t = Math.min(1, (now - f.startAt) / f.duration);
      const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      
      const nx = (1-e)*(1-e)*f.start.x + 2*(1-e)*e*f.cp.x + e*e*f.end.x;
      const ny = (1-e)*(1-e)*f.start.y + 2*(1-e)*e*f.cp.y + e*e*f.end.y;
      
      if (!f.trail) f.trail = [];
      f.trail.push({x: nx, y: ny});
      if (f.trail.length > 25) f.trail.shift();
      
      f.pos = {x: nx, y: ny};

      if (t >= 1 && !f.arrived) {
        f.arrived = true;
        // 停留 5 秒
        centerWinners.push({ name: f.name, born: now, expire: now + 5000 });
        createSparks(cx, cy, '#00f2fe'); 
        createSparks(cx, cy, '#ffd700');
      }
    }
    flyers = flyers.filter(f => !f.arrived);

    // 处理中心名字排队显示
    if (centerWinners.length > 0) {
      if (now > centerWinners[0].expire) {
        centerWinners.shift(); 
        if (centerWinners.length > 0) {
          centerWinners[0].born = now;
          centerWinners[0].expire = now + 5000;
        } else {
          // 所有动画完成，解除右侧按钮锁定
          state = 'idle';
          document.querySelector('.right').classList.remove('is-drawing');
          $('stopBtn').disabled = true;
          $('startBtn').disabled = false;
          renderPrizeList();
        }
      }
    }
  }

  function draw(now) {
    if (!W) return;
    ctx.clearRect(0, 0, W, H);
    
    ctx.fillStyle = '#030610';
    ctx.fillRect(0, 0, W, H);
    
    bgStars.forEach(s => {
      ctx.fillStyle = `rgba(0, 242, 254, ${s.a})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.s, 0, Math.PI*2);
      ctx.fill();
    });

    const bg = ctx.createRadialGradient(cx, cy, R*0.1, cx, cy, R*1.8);
    if (state === 'spinning') {
      const pulse = Math.abs(Math.sin(now / 150));
      bg.addColorStop(0, `rgba(0, 242, 254, ${0.15 + pulse*0.1})`);
      bg.addColorStop(1, 'rgba(0, 0, 0, 0)');
    } else if (centerWinners.length > 0) {
      bg.addColorStop(0, 'rgba(255, 215, 0, 0.25)'); 
      bg.addColorStop(1, 'rgba(0, 0, 0, 0)');
    } else {
      bg.addColorStop(0, 'rgba(0, 242, 254, 0.05)');
      bg.addColorStop(1, 'rgba(0, 0, 0, 0)');
    }
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
    const cosX = Math.cos(-0.18), sinX = Math.sin(-0.18);
    const arr = [];
    
    ensureSlotCapacity();
    const pool = participants.filter(p => !p.won);
    assignNamesToSlots(pool);   // 无人登记 → 全部是光点；有人登记 → 光点逐个替换成人名
    
    for (let i = 0; i < MAX; i++) {
      const s = slots[i];
      let x = s.bx * cosY - s.bz * sinY;
      let z = s.bx * sinY + s.bz * cosY;
      let y = s.by * cosX - z * sinX;
      z = s.by * sinX + z * cosX;
      
      const persp = 2.4 / (2.4 + z);

      s.sx = cx + x * R * persp;
      s.sy = cy + y * R * persp;
      s.sz = z;
      s.persp = persp;

      arr.push({ x: s.sx, y: s.sy, z: z, persp: persp, name: s.name, seed: s.seed });
    }
    
    arr.sort((a, b) => a.z - b.z);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (const a of arr) {
      if (a.name) {
        const depth = (a.z + 1) / 2;
        const alpha = 0.15 + depth * 0.85;
        const size = 10 + a.persp * 9;
        ctx.font = `bold ${size.toFixed(1)}px "Microsoft YaHei"`;
        ctx.shadowColor = 'rgba(0, 242, 254, 0.8)';
        ctx.shadowBlur = a.persp * 10;
        ctx.fillStyle = `rgba(220, 240, 255, ${alpha})`;
        ctx.fillText(a.name, a.x, a.y);
        ctx.shadowBlur = 0;
      } else {
        // 未分配的槽位 = 球面上的光点（默认满屏光点，构成完整球体）
        const depth = (a.z + 1) / 2;
        const tw = 0.7 + 0.3 * Math.sin(now * 0.0022 + a.seed * 6.283);
        const rad = (1.1 + depth * 1.9) * a.persp;
        ctx.beginPath();
        ctx.arc(a.x, a.y, rad, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(150, 240, 255, ${(0.16 + depth * 0.66) * tw})`;
        ctx.shadowColor = 'rgba(0, 242, 254, 0.9)';
        ctx.shadowBlur = depth * 9;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // 彗星轨迹
    for (const f of flyers) {
      if (f.pos && f.trail) {
        for (let i = 1; i < f.trail.length; i++) {
          const p1 = f.trail[i-1];
          const p2 = f.trail[i];
          const trailAlpha = i / f.trail.length;
          
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = `rgba(0, 242, 254, ${trailAlpha})`;
          ctx.lineWidth = trailAlpha * 8;
          ctx.lineCap = 'round';
          ctx.stroke();
        }
        
        const headGrad = ctx.createRadialGradient(f.pos.x, f.pos.y, 0, f.pos.x, f.pos.y, 25);
        headGrad.addColorStop(0, '#fff');
        headGrad.addColorStop(0.3, '#00f2fe');
        headGrad.addColorStop(1, 'rgba(0, 242, 254, 0)');
        ctx.fillStyle = headGrad;
        ctx.beginPath();
        ctx.arc(f.pos.x, f.pos.y, 25, 0, Math.PI*2);
        ctx.fill();
      }
    }

    // 粒子
    for (const p of sparks) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    // ======== 中心名字超强高亮渲染 ========
    if (centerWinners.length > 0) {
      const w = centerWinners[0];
      const age = (now - w.born) / 1000;
      
      const spotlight = ctx.createRadialGradient(cx, cy, 0, cx, cy, 500);
      spotlight.addColorStop(0, 'rgba(255, 215, 0, 0.4)');
      spotlight.addColorStop(0.5, 'rgba(0, 242, 254, 0.1)');
      spotlight.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = spotlight;
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(age * 0.5); 
      ctx.beginPath();
      ctx.ellipse(0, 0, 250, 80, 0, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 20;
      ctx.stroke();
      ctx.restore();

      let scale = 1;
      if (age < 0.3) {
        scale = 0.5 + (age / 0.3) * 0.6;
      } else {
        scale = 1.1 - (age - 0.3) * 0.1;
      }

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      
      ctx.font = '900 130px "Microsoft YaHei"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      ctx.shadowColor = '#00f2fe';
      ctx.shadowBlur = 120;
      ctx.fillStyle = '#fff';
      ctx.fillText(w.name, 0, 0);
      
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#ffd700';
      ctx.strokeText(w.name, 0, 0);
      
      const grad = ctx.createLinearGradient(0, -70, 0, 70);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.2, '#fff8b0');
      grad.addColorStop(0.8, '#ffd700');
      grad.addColorStop(1, '#ff8c00');
      ctx.fillStyle = grad;
      
      ctx.shadowBlur = 40;
      ctx.shadowColor = '#ffd700';
      ctx.fillText(w.name, 0, 0);
      
      ctx.restore();
    }
  }

  let lastTime = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt, now);
    draw(now);
    requestAnimationFrame(frame);
  }

  function renderUI() {
    if ($('totalCount')) $('totalCount').textContent = participants.length;
    renderPrizeList();
    renderWinners();
    renderSyncStat();
    if (!window.__bulk && $('rosterModal') && $('rosterModal').style.display === 'flex') renderRoster();
  }

  function renderPrizeList() {
    if (!currentPrizeId && prizes.length) currentPrizeId = prizes[0].id;
    $('prizeList').innerHTML = prizes.map(p => {
      const remain = p.quota - p.drawn;
      const isActive = p.id === currentPrizeId;
      const isDone = remain <= 0;
      return `<div class="prize-btn ${isActive?'active':''} ${isDone?'done':''}" 
                onclick="selectPrize('${p.id}')" ${isDone||state!=='idle'?'disabled':''}>
                ${p.name}<br><span style="font-size:12px;font-weight:normal">剩余 ${remain} / ${p.quota}</span>
              </div>`;
    }).join('');
  }

  window.selectPrize = (id) => {
    if (state !== 'idle') return;
    currentPrizeId = id;
    renderPrizeList();
  };

  function renderWinners() {
    $('winnerList').innerHTML = [...winners].reverse().map(w => 
      `<div class="winner-item"><span>${w.prize}</span><b>${w.name}</b></div>`
    ).join('') || '<div style="color:#6f8fb0;text-align:center;font-size:12px;margin-top:20px">暂无中奖记录</div>';
  }

  // --- 抽奖控制 ---
  $('startBtn').onclick = () => {
    if (state !== 'idle') return;
    if (!isBgmPlaying) { bgm.play().catch(e=>{}); isBgmPlaying = true; $('bgmBtn').textContent = '🔊'; }
    
    state = 'spinning';
    targetSpeed = 3.5;
    $('startBtn').disabled = true;
    $('stopBtn').disabled = false;
    centerWinners = []; 
    
    document.querySelector('.right').classList.add('is-drawing');
  };

  $('stopBtn').onclick = () => {
    if (state !== 'spinning') return;
    state = 'stopping';
    targetSpeed = 0.2;
    $('stopBtn').disabled = true;

    const prize = prizes.find(p => p.id === currentPrizeId);
    const pool = participants.filter(p => !p.won);
    
    if (!prize || pool.length === 0) {
      setTimeout(() => { 
        state = 'idle'; 
        $('startBtn').disabled = false; 
        document.querySelector('.right').classList.remove('is-drawing');
      }, 1000);
      return;
    }

    let batch = parseInt($('drawCount').value) || 1;
    batch = Math.min(batch, prize.quota - prize.drawn, pool.length);
    
    if (batch <= 0) {
      setTimeout(() => { 
        state = 'idle'; 
        $('startBtn').disabled = false; 
        document.querySelector('.right').classList.remove('is-drawing');
      }, 1000);
      return;
    }

    // 强化随机抽取：加密随机源 + 多轮 Fisher-Yates 洗牌 + 无偏拒绝采样
    const picked = pickWinners(pool, batch);
    resetOrigins();
    slots.forEach(s => { s.used = false; });
    
    picked.forEach((p, i) => {
      p.won = true;
      prize.drawn++;
      winners.push({ name: p.disp || p.name, prize: prize.name, uid: p.uid });
    });
    saveData();
    renderUI();

    const now = performance.now();
    
    picked.forEach((p, index) => {
      // 起点 = 该中奖者对应光点此刻在球面上的真实位置（随球体旋转，逐轮不同）
      const origin = slotOriginFor(p.name);
      flyers.push({
        name: p.disp || p.name,
        start: { x: origin.x, y: origin.y },
        end: { x: cx, y: cy },
        cp: { x: cx + (rf()-0.5)*R*2.4, y: cy + (rf()-0.5)*R*2.0 },  // 控制点同样随机
        startAt: now + 700 + index * (140 + secureRandInt(160)),
        duration: 1800 + secureRandInt(1200),                        // 飞行时长随机，节奏不重复
        arrived: false,
        pos: null,
        trail: []
      });
    });
    
    state = 'flying';
  };

  // ======== 名单管理：现场兜底录入（完全不依赖外网）+ 同步通道设置 ========
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }
  function renderRoster() {
    const stat = $('rosterStat');
    const list = $('rz_list');
    if (!stat || !list) return;
    const total = participants.length;
    const scanned = participants.filter(p => p.src !== 'local').length;
    const pending = participants.filter(p => !p.won).length;
    stat.innerHTML = '已登记 <b style="color:#00f2fe">' + total + '</b> 人（扫码 ' + scanned +
      ' · 现场录入 ' + (total - scanned) + '）　待抽奖 ' + pending + '　已中奖 ' + (total - pending);

    const live = COMM.chOk.filter(Boolean).length;
    const tm = COMM.lastSync ? new Date(COMM.lastSync).toLocaleTimeString('zh-CN', { hour12: false }) : '尚未';
    const tip = $('rz_commTip');
    if (tip) {
      tip.innerHTML = '通道服务器：' + esc(COMM.server) + '　并行子通道：' + COMM.subs +
        ' 条（实时在线 ' + live + '）　最近同步：' + tm +
        '<br>子通道越多，可同时承载的登记人数越高：单条约支撑两三百人，' + COMM.subs +
        ' 条即可支撑 ' + (COMM.subs * 200) + ' 人以上；且大屏每 20 秒按游标回补拉取，断线期间提交的登记也会自动补回。';
    }

    const kw = ($('rz_search').value || '').trim().toLowerCase();
    let arr = participants.slice();
    if (kw) arr = arr.filter(p => String(p.disp || p.name).toLowerCase().indexOf(kw) >= 0);
    if (!arr.length) { list.innerHTML = '<div class="rz-empty">' + (kw ? '没有匹配的姓名' : '名单为空，可扫码登记或在此直接录入') + '</div>'; return; }
    const shown = arr.slice(0, 1000);
    list.innerHTML = shown.map(p =>
      '<div class="rz-item"><span class="nm">' + esc(p.disp || p.name) + '</span>' +
      '<span class="tag">' + (p.src === 'local' ? '现场' : '扫码') + '</span>' +
      '<span class="tag' + (p.won ? ' won' : '') + '">' + (p.won ? '已中奖' : '待抽') + '</span>' +
      '<button class="del" data-uid="' + esc(p.uid) + '">&times;</button></div>'
    ).join('') + (arr.length > shown.length ? '<div class="rz-empty">仅显示前 1000 条，可输入姓名搜索定位</div>' : '');
    list.querySelectorAll('.del').forEach(btn => {
      btn.onclick = () => {
        const uid = btn.getAttribute('data-uid');
        const p = participants.find(x => x.uid === uid);
        if (p && confirm('删除「' + (p.disp || p.name) + '」？' + (p.won ? '其中奖记录也会一并移除。' : ''))) removeParticipant(uid);
      };
    });
  }

  function openRoster() {
    if ($('rz_server')) $('rz_server').value = COMM.server;
    if ($('rz_chsub')) $('rz_chsub').value = COMM.subs;
    $('rosterModal').style.display = 'flex';
    renderRoster();
  }
  $('rosterBtn').onclick = () => { openRoster(); };
  $('rz_close').onclick = () => { $('rosterModal').style.display = 'none'; };
  $('rosterModal').addEventListener('click', (e) => { if (e.target === $('rosterModal')) $('rosterModal').style.display = 'none'; });
  $('rz_search').addEventListener('input', () => renderRoster());

  $('rz_addOne').onclick = () => {
    const nm = $('rz_one').value.trim();
    if (!nm) { showTip('请输入姓名'); return; }
    const p = addParticipant(nm, newUid('l'), 'local');
    $('rz_one').value = '';
    showTip(p ? '已添加「' + p.disp + '」' : '该姓名已在本机登记过');
    renderRoster();
  };
  $('rz_one').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('rz_addOne').click(); });

  $('rz_import').onclick = () => {
    const raw = $('rz_bulk').value || '';
    const names = raw.split(/[\n\r,，、;；\t]+/).map(x => x.trim()).filter(Boolean);
    if (!names.length) { showTip('请先粘贴名单，每行一个姓名'); return; }
    const CAP = 2000;
    const use = names.slice(0, CAP);
    window.__bulk = true;
    let n = 0;
    for (const nm of use) { if (addParticipant(nm, newUid('l'), 'local')) n++; }
    window.__bulk = false;
    saveData();
    renderUI();
    renderRoster();
    $('rz_bulk').value = '';
    showTip('已导入 ' + n + ' 人，当前共 ' + participants.length + ' 人' + (names.length > CAP ? '（单次上限 ' + CAP + ' 人，剩余请再导一次）' : ''));
  };

  $('rz_copy').onclick = async () => {
    const txt = participants.map(p => p.disp || p.name).join('\n');
    if (!txt) { showTip('名单为空'); return; }
    let done = false;
    try { await navigator.clipboard.writeText(txt); done = true; } catch (e) { done = false; }
    if (!done) {
      const ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { done = document.execCommand('copy'); } catch (e) { done = false; }
      document.body.removeChild(ta);
    }
    showTip(done ? ('已复制 ' + participants.length + ' 个姓名') : '复制失败，可在大屏名单区逐个核对');
  };

  $('rz_clear').onclick = () => {
    if (!confirm('确定清空全部 ' + participants.length + ' 人名单？中奖记录与各奖项已抽数量会一并清零。')) return;
    participants = [];
    winners = [];
    prizes.forEach(p => { p.drawn = 0; });
    relabel();
    saveData();
    renderUI();
    renderRoster();
    showTip('名单已清空');
  };

  $('rz_saveComm').onclick = () => {
    let sv = ($('rz_server').value || '').trim().replace(/\/+$/, '');
    const cs = parseInt($('rz_chsub').value, 10);
    if (sv && !/^https?:\/\//.test(sv)) {
      if (/^[\w.-]+$/.test(sv)) sv = 'https://' + sv;
      else { showTip('通道服务器请填完整地址，如 https://ntfy.sh'); return; }
    }
    if (!sv) sv = 'https://ntfy.sh';
    if (!(cs >= 2 && cs <= 16)) { showTip('并行子通道数请填 2 ~ 16'); return; }
    try {
      localStorage.setItem('lottery_comm_server', sv);
      localStorage.setItem('lottery_comm_subs', String(cs));
    } catch (e) {}
    COMM.server = sv;
    COMM.subs = cs;
    restartComm();
    renderQR();
    if (qrTips) qrTips.innerHTML = '微信 / 手机浏览器 扫码参与<br><span style="font-size:12px;color:#8fb8e0;word-break:break-all">' + buildJoinUrl() + '</span>';
    renderRoster();
    showTip('通道已更新：' + sv + '（' + cs + ' 路），二维码已同步');
  };

  // --- 设置弹窗逻辑 ---
  $('settingBtn').onclick = () => {
    if (state !== 'idle') return alert('请等待当前抽奖动画结束');
    renderEditor();
    $('modalOverlay').style.display = 'flex';
  };
  $('closeModal').onclick = () => $('modalOverlay').style.display = 'none';

  function renderEditor() {
    const box = $('prizeEditor');
    box.innerHTML = '';
    prizes.forEach((p, i) => {
      const row = document.createElement('div');
      row.className = 'prize-edit-row';
      row.innerHTML = `
        <input class="ename" value="${p.name}" placeholder="奖项名称">
        <input class="equota" type="number" min="0" value="${p.quota}" placeholder="数量">
        <button class="edel" title="删除">×</button>
      `;
      row.querySelector('.edel').onclick = () => {
        collectEditor();
        prizes.splice(i, 1);
        if (!prizes.length) prizes.push({ id: 'p0', name: '新奖项', quota: 1, drawn: 0 });
        currentPrizeId = null;
        renderEditor();
      };
      box.appendChild(row);
    });
  }

  function collectEditor() {
    const rows = [...document.querySelectorAll('#prizeEditor .prize-edit-row')];
    prizes = rows.map((r, i) => ({
      id: 'p' + i,
      name: r.querySelector('.ename').value.trim() || ('奖项' + (i + 1)),
      quota: Math.max(0, parseInt(r.querySelector('.equota').value) || 0),
      drawn: 0
    }));
  }

  $('addPrizeBtn').onclick = () => {
    collectEditor();
    prizes.push({ id: 'p' + prizes.length, name: '新奖项', quota: 1, drawn: 0 });
    currentPrizeId = null;
    renderEditor();
  };

  $('savePrizesBtn').onclick = () => {
    collectEditor();
    
    // 修复：保存奖项时，重置所有人的中奖状态并清空名单
    prizes.forEach(p => p.drawn = 0);
    participants.forEach(p => p.won = false); 
    winners = [];
    
    saveData();
    currentPrizeId = null;
    renderUI();
    $('modalOverlay').style.display = 'none';
  };

  $('resetBtn').onclick = () => {
    if (!confirm('确定要清空所有已抽奖项数量，并清空中奖名单吗？')) return;
    prizes.forEach(p => p.drawn = 0);
    participants.forEach(p => p.won = false); // 修复：同时重置人员的未中奖状态
    winners = [];
    saveData();
    renderUI();
    $('modalOverlay').style.display = 'none';
  };

  // 启动
  initSlots();
  resize();
  renderUI();
  requestAnimationFrame(frame);
}
</script>
</body>
