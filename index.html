<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>活动抽奖</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#04070d;color:#eaf4ff;font-family:"Microsoft YaHei",sans-serif;overflow:hidden}

/* ---------- 大屏端样式 ---------- */
#screen{height:100vh;display:flex;flex-direction:column}
header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid rgba(90,170,255,.2);background:rgba(12,28,52,.95)}
.brand{font-size:28px;font-weight:800;color:#5db4ff;letter-spacing:2px}
.header-right{display:flex;align-items:center;gap:20px}
.count{font-size:18px;color:#bfe0ff}
.count span{font-size:32px;font-weight:bold;color:#fff;margin:0 5px}

/* 扫码按钮和设置按钮 */
#showQrBtn{height:44px;padding:0 20px;border-radius:8px;background:linear-gradient(180deg,#8fd3ff,#3d9dff);color:#04101f;font-size:16px;font-weight:bold;cursor:pointer;border:none;box-shadow:0 4px 15px rgba(61,157,255,.4);transition:transform .1s}
#showQrBtn:active{transform:scale(0.95)}
#settingBtn{height:36px;padding:0 15px;border:1px solid rgba(120,190,255,.4);border-radius:8px;background:rgba(40,90,150,.3);color:#9fd8ff;font-size:14px;cursor:pointer;transition:.2s}
#settingBtn:hover{background:rgba(60,120,200,.5);border-color:#5db4ff}

main{flex:1;display:flex;min-height:0}
.left{width:280px;background:rgba(8,16,28,.9);padding:15px;border-right:1px solid rgba(90,170,255,.2);overflow-y:auto}
.left h3{margin-bottom:15px;font-size:16px;text-align:center;color:#8fb8e0}
.winner-item{background:rgba(20,38,64,.6);padding:10px;margin-bottom:8px;border-radius:6px;border-left:3px solid #5db4ff;display:flex;justify-content:space-between;font-size:14px}
.winner-item span{color:#8fb8e0}
.canvas-box{flex:1;position:relative}
canvas{display:block;width:100%;height:100%}
.right{width:260px;background:rgba(8,16,28,.9);padding:20px;border-left:1px solid rgba(90,170,255,.2);display:flex;flex-direction:column;gap:10px}
.prize-btn{padding:12px;border-radius:8px;border:1px solid rgba(90,170,255,.3);background:rgba(20,38,64,.5);cursor:pointer;text-align:center;font-size:16px;font-weight:bold;transition:.2s}
.prize-btn.active{border-color:#5db4ff;background:rgba(40,90,150,.6);box-shadow:0 0 15px rgba(70,160,255,.3)}
.prize-btn.done{opacity:.3;cursor:not-allowed}
.controls{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.controls button{height:50px;border:none;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer}
#startBtn{background:linear-gradient(180deg,#8fd3ff,#3d9dff);color:#04101f}
#stopBtn{background:linear-gradient(180deg,#ffb36b,#ff7a3d);color:#1a0800}
#stopBtn:disabled{opacity:.3;cursor:not-allowed}

/* ---------- 放大二维码弹窗 ---------- */
#qrModal{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:200;cursor:pointer}
.qr-container{background:#fff;padding:24px;border-radius:16px;box-shadow:0 0 50px rgba(90,170,255,.5);display:flex;flex-direction:column;align-items:center;animation:popIn .3s ease-out}
@keyframes popIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
#bigQrcode img{width:320px;height:320px;display:block}
.qr-tips{margin-top:20px;font-size:24px;font-weight:bold;color:#0f1a2e;letter-spacing:2px}
.qr-subtips{margin-top:30px;font-size:18px;color:#8fb8e0;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* ---------- 手机登记页样式 ---------- */
#mobile{display:none;height:100vh;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 20%,#12305a,#05080f 70%)}
.card{width:100%;max-width:360px;background:#0f1a2e;border:1px solid rgba(100,180,255,.3);border-radius:16px;padding:30px 20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.card h2{margin-bottom:10px;color:#fff}
.card p{color:#8fb8e0;font-size:14px;margin-bottom:20px}
.card input{width:100%;height:50px;margin-bottom:15px;border-radius:8px;border:1px solid rgba(120,190,255,.3);background:#07111f;color:#fff;font-size:16px;padding:0 15px;outline:none}
.card button{width:100%;height:50px;border:none;border-radius:8px;background:#3d9dff;color:#fff;font-size:18px;font-weight:bold;cursor:pointer;transition:opacity .2s}
.card button:disabled{opacity:.5}
#msg{margin-top:15px;font-size:14px;color:#9fe0a0;min-height:20px}

/* ---------- 设置弹窗 ---------- */
#modalOverlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100}
#modal{width:500px;max-width:90vw;background:#0f1a2e;border:1px solid rgba(90,170,255,.3);border-radius:12px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid rgba(90,170,255,.2)}
.modal-header h3{margin:0;color:#fff;font-size:18px}
.close-btn{background:none;border:none;color:#8fb8e0;font-size:24px;cursor:pointer;line-height:1}
.prize-edit-row{display:flex;gap:10px;margin-bottom:10px;align-items:center}
.prize-edit-row input{height:36px;border-radius:6px;border:1px solid rgba(120,190,255,.3);background:#07111f;color:#fff;padding:0 10px;outline:none;font-size:14px}
.prize-edit-row .ename{flex:1}
.prize-edit-row .equota{width:80px}
.prize-edit-row .edel{width:36px;height:36px;border:none;border-radius:6px;background:rgba(120,40,40,.6);color:#ffbaba;cursor:pointer;font-size:18px}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions button{flex:1;height:40px;border:none;border-radius:6px;cursor:pointer;font-size:15px;font-weight:bold}
#addPrizeBtn{background:#2a5a8a;color:#fff}
#savePrizesBtn{background:#3d9dff;color:#fff}
#resetBtn{background:rgba(120,40,40,.6);color:#ffbaba;margin-top:10px;width:100%}
</style>
</head>
<body>

<!-- 大屏界面 -->
<div id="screen">
  <header>
    <div class="brand">幸运抽奖</div>
    <div class="header-right">
      <div class="count">已参与 <span id="totalCount">0</span> 人</div>
      <button id="showQrBtn">📱 扫码参与抽奖</button>
      <button id="settingBtn">⚙️ 设置奖项</button>
    </div>
  </header>
  <main>
    <div class="left">
      <h3>🏆 中奖名单</h3>
      <div id="winnerList"></div>
    </div>
    <div class="canvas-box">
      <canvas id="stage"></canvas>
    </div>
    <div class="right">
      <div id="prizeList"></div>
      <div class="controls">
        <button id="startBtn">开始抽奖</button>
        <button id="stopBtn" disabled>停止</button>
      </div>
    </div>
  </main>
</div>

<!-- 放大版二维码弹窗 -->
<div id="qrModal">
  <div class="qr-container">
    <div id="bigQrcode"></div>
    <div class="qr-tips">微信/浏览器 扫码参与</div>
  </div>
  <div class="qr-subtips">点击屏幕任意位置关闭</div>
</div>

<!-- 手机登记界面 -->
<div id="mobile">
  <div class="card">
    <h2>活动登记</h2>
    <p>请输入您的姓名参与抽奖</p>
    <input id="m_name" placeholder="请输入姓名（必填）" maxlength="15" autocomplete="off">
    <button id="m_submit">提交登记</button>
    <p id="msg"></p>
  </div>
</div>

<!-- 设置奖项弹窗 -->
<div id="modalOverlay">
  <div id="modal">
    <div class="modal-header">
      <h3>⚙️ 奖项设置</h3>
      <button class="close-btn" id="closeModal">&times;</button>
    </div>
    <div id="prizeEditor"></div>
    <div class="modal-actions">
      <button id="addPrizeBtn">＋ 添加奖项</button>
      <button id="savePrizesBtn">保存并生效</button>
    </div>
    <button id="resetBtn">重置所有中奖状态（清空已抽数量）</button>
  </div>
</div>

<!-- 依赖 -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const urlParams = new URLSearchParams(window.location.search);
const isJoinMode = urlParams.has('join'); 

// ======== 核心通信参数配置 ========
let roomId = '';
let ntfyTopic = '';

function initComm() {
  if (isJoinMode) {
    roomId = urlParams.get('join');
    ntfyTopic = 'lottery_sys_' + roomId;
  } else {
    roomId = urlParams.get('room');
    if (!roomId) {
      roomId = 'room_' + Math.random().toString(36).substring(2, 8);
      const newUrl = window.location.pathname + '?room=' + roomId;
      window.history.replaceState(null, '', newUrl);
    }
    ntfyTopic = 'lottery_sys_' + roomId;
  }

  if (!isJoinMode) {
    const ev = new EventSource(`https://ntfy.sh/${ntfyTopic}/sse`);
    ev.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        if (data.event === 'message' && data.message) {
          addParticipant(data.message);
        }
      } catch(err){}
    };
  }
}

// ======== 数据存储逻辑 ========
let participants = [];
let winners = [];
let prizes = [
  { id: "p0", name: "特等奖", quota: 1, drawn: 0 },
  { id: "p1", name: "一等奖", quota: 3, drawn: 0 },
  { id: "p2", name: "二等奖", quota: 10, drawn: 0 },
  { id: "p3", name: "三等奖", quota: 20, drawn: 0 }
];

function loadData() {
  try {
    const p = localStorage.getItem('lottery_participants');
    if (p) participants = JSON.parse(p);
    const w = localStorage.getItem('lottery_winners');
    if (w) winners = JSON.parse(w);
    const pr = localStorage.getItem('lottery_prizes');
    if (pr) prizes = JSON.parse(pr);
  } catch(e){}
}
function saveData() {
  try {
    localStorage.setItem('lottery_participants', JSON.stringify(participants));
    localStorage.setItem('lottery_winners', JSON.stringify(winners));
    localStorage.setItem('lottery_prizes', JSON.stringify(prizes));
  } catch(e){}
}

function addParticipant(name) {
  name = name.trim();
  if (!name) return false;
  if (participants.some(p => p.name === name)) return false;
  
  participants.push({ name, won: false });
  saveData();
  renderUI();
  return true;
}

// ======== 手机端逻辑 ========
if (isJoinMode) {
  document.getElementById('screen').style.display = 'none';
  document.getElementById('mobile').style.display = 'flex';
  initComm();

  $('m_submit').onclick = async () => {
    const name = $('m_name').value.trim();
    if (!name) {
      $('msg').style.color = '#ff9a9a';
      $('msg').textContent = '请输入姓名';
      return;
    }
    
    $('m_submit').disabled = true;
    $('m_submit').textContent = '提交中...';
    
    try {
      await fetch(`https://ntfy.sh/${ntfyTopic}`, {
        method: 'POST',
        body: name
      });
      $('msg').style.color = '#9fe0a0';
      $('msg').textContent = '登记成功！请关注大屏';
      $('m_name').value = '';
    } catch (e) {
      $('msg').style.color = '#ff9a9a';
      $('msg').textContent = '网络异常，请重试';
    } finally {
      setTimeout(() => {
        $('m_submit').disabled = false;
        $('m_submit').textContent = '提交登记';
      }, 2000);
    }
  };
} else {
  // ======== 大屏端逻辑 ========
  loadData();
  initComm();

  // 生成超大尺寸二维码（存入隐藏弹窗中）
  const joinUrl = location.origin + location.pathname + '?join=' + roomId;
  new QRCode($("bigQrcode"), { text: joinUrl, width: 320, height: 320 });

  // 扫码按钮点击事件
  $('showQrBtn').onclick = () => {
    $('qrModal').style.display = 'flex';
  };
  // 点击遮罩层任意位置关闭
  $('qrModal').onclick = () => {
    $('qrModal').style.display = 'none';
  };

  // --- Canvas 3D 球体引擎 ---
  const canvas = $('stage');
  const ctx = canvas.getContext('2d');
  let W, H, cx, cy, R, dpr;
  let rotY = 0, speed = 0.2, targetSpeed = 0.2;
  let slots = [], flyers = [], centerWinner = null, state = 'idle', currentPrizeId = null;
  const MAX = 400;

  function initSlots() {
    slots = [];
    for (let i = 0; i < MAX; i++) {
      const y = 1 - (i / (MAX - 1)) * 2;
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      const theta = Math.PI * (3 - Math.sqrt(5)) * i;
      slots.push({ bx: Math.cos(theta) * r, by: y, bz: Math.sin(theta) * r, name: null });
    }
  }

  function resize() {
    const box = canvas.parentElement;
    dpr = window.devicePixelRatio || 1;
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.scale(dpr, dpr);
    cx = W / 2; cy = H / 2; R = Math.min(W, H) * 0.38;
  }
  window.addEventListener('resize', resize);

  function update(dt, now) {
    speed += (targetSpeed - speed) * Math.min(1, dt * 2);
    rotY += speed * dt;

    for (let i = flyers.length - 1; i >= 0; i--) {
      const f = flyers[i];
      if (now < f.startAt) continue;
      const t = Math.min(1, (now - f.startAt) / f.duration);
      const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      f.pos = {
        x: (1-e)*(1-e)*f.start.x + 2*(1-e)*e*f.cp.x + e*e*f.end.x,
        y: (1-e)*(1-e)*f.start.y + 2*(1-e)*e*f.cp.y + e*e*f.end.y
      };
      if (t >= 1 && !f.arrived) {
        f.arrived = true;
        f.holdUntil = now + 1500;
        centerWinner = { name: f.name, born: now };
      }
    }
    flyers = flyers.filter(f => !(f.arrived && now > f.holdUntil));
    if (centerWinner && now - centerWinner.born > 1600) centerWinner = null;

    if (state === 'flying' && flyers.length === 0 && !centerWinner) {
      state = 'idle';
      $('stopBtn').disabled = true;
      $('startBtn').disabled = false;
      renderPrizeList();
    }
  }

  function draw() {
    if (!W) return;
    ctx.clearRect(0, 0, W, H);
    
    const bg = ctx.createRadialGradient(cx, cy, R*0.1, cx, cy, R*1.5);
    bg.addColorStop(0, 'rgba(30,70,130,0.2)');
    bg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
    const cosX = Math.cos(-0.18), sinX = Math.sin(-0.18);
    const arr = [];
    
    let pool = participants.filter(p => !p.won);
    let displayNames = pool.length > 0 ? pool.map(p => p.name) : Array(30).fill("等待登记...");
    
    for (let i = 0; i < MAX; i++) {
      const s = slots[i];
      let x = s.bx * cosY - s.bz * sinY;
      let z = s.bx * sinY + s.bz * cosY;
      let y = s.by * cosX - z * sinX;
      z = s.by * sinX + z * cosX;
      
      const persp = 2.4 / (2.4 + z);
      arr.push({
        x: cx + x * R * persp,
        y: cy + y * R * persp,
        z: z,
        persp: persp,
        name: displayNames[i % displayNames.length] || null
      });
    }
    
    arr.sort((a, b) => a.z - b.z);
    
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    for (const a of arr) {
      if (a.name) {
        const depth = (a.z + 1) / 2;
        const alpha = 0.1 + depth * 0.8;
        const size = 9 + a.persp * 9;
        ctx.font = `600 ${size.toFixed(1)}px "Microsoft YaHei"`;
        ctx.fillStyle = `rgba(190,225,255,${alpha})`;
        ctx.fillText(a.name, a.x, a.y);
      }
    }

    for (const f of flyers) {
      if (f.pos) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px "Microsoft YaHei"';
        ctx.fillText(f.name, f.pos.x, f.pos.y);
      }
    }

    if (centerWinner) {
      const age = (Date.now() - centerWinner.born) / 1000;
      const alpha = Math.min(1, age * 3) * Math.min(1, (1.6 - age) * 5);
      ctx.save();
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.font = 'bold 60px "Microsoft YaHei"';
      ctx.shadowColor = '#5db4ff';
      ctx.shadowBlur = 40;
      ctx.fillStyle = '#fff';
      ctx.fillText(centerWinner.name, cx, cy);
      ctx.restore();
    }
  }

  let lastTime = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt, now);
    draw();
    requestAnimationFrame(frame);
  }

  function renderUI() {
    $('totalCount').textContent = participants.length;
    renderPrizeList();
    renderWinners();
  }

  function renderPrizeList() {
    if (!currentPrizeId && prizes.length) currentPrizeId = prizes[0].id;
    $('prizeList').innerHTML = prizes.map(p => {
      const remain = p.quota - p.drawn;
      const isActive = p.id === currentPrizeId;
      const isDone = remain <= 0;
      return `<div class="prize-btn ${isActive?'active':''} ${isDone?'done':''}" 
                onclick="selectPrize('${p.id}')" ${isDone||state!=='idle'?'disabled':''}>
                ${p.name}<br><span style="font-size:12px;font-weight:normal">剩余 ${remain} / ${p.quota}</span>
              </div>`;
    }).join('');
  }

  window.selectPrize = (id) => {
    if (state !== 'idle') return;
    currentPrizeId = id;
    renderPrizeList();
  };

  function renderWinners() {
    $('winnerList').innerHTML = winners.map(w => 
      `<div class="winner-item"><span>${w.prize}</span><b>${w.name}</b></div>`
    ).join('') || '<div style="color:#6f8fb0;text-align:center;font-size:12px;margin-top:20px">暂无中奖记录</div>';
  }

  // --- 抽奖控制 ---
  $('startBtn').onclick = () => {
    if (state !== 'idle') return;
    state = 'spinning';
    targetSpeed = 3.5;
    $('startBtn').disabled = true;
    $('stopBtn').disabled = false;
  };

  $('stopBtn').onclick = () => {
    if (state !== 'spinning') return;
    state = 'stopping';
    targetSpeed = 0.2;
    $('stopBtn').disabled = true;

    const prize = prizes.find(p => p.id === currentPrizeId);
    const pool = participants.filter(p => !p.won);
    
    if (!prize || pool.length === 0) {
      setTimeout(() => { state = 'idle'; $('startBtn').disabled = false; }, 1000);
      return;
    }

    const picked = pool[Math.floor(Math.random() * pool.length)];
    
    picked.won = true;
    prize.drawn++;
    winners.push({ name: picked.name, prize: prize.name });
    saveData();
    renderUI();

    const now = performance.now();
    flyers.push({
      name: picked.name,
      start: { x: cx + (Math.random()-0.5)*R, y: cy + (Math.random()-0.5)*R },
      end: { x: cx, y: cy },
      cp: { x: cx + (Math.random()-0.5)*R, y: cy + (Math.random()-0.5)*R },
      startAt: now + 1500,
      duration: 1500,
      arrived: false, holdUntil: 0, pos: null
    });
    state = 'flying';
  };

  // --- 设置弹窗逻辑 ---
  $('settingBtn').onclick = () => {
    if (state !== 'idle') return alert('请等待当前抽奖动画结束');
    renderEditor();
    $('modalOverlay').style.display = 'flex';
  };
  $('closeModal').onclick = () => $('modalOverlay').style.display = 'none';

  function renderEditor() {
    const box = $('prizeEditor');
    box.innerHTML = '';
    prizes.forEach((p, i) => {
      const row = document.createElement('div');
      row.className = 'prize-edit-row';
      row.innerHTML = `
        <input class="ename" value="${p.name}" placeholder="奖项名称">
        <input class="equota" type="number" min="0" value="${p.quota}" placeholder="数量">
        <button class="edel" title="删除">×</button>
      `;
      row.querySelector('.edel').onclick = () => {
        collectEditor();
        prizes.splice(i, 1);
        if (!prizes.length) prizes.push({ id: 'p0', name: '新奖项', quota: 1, drawn: 0 });
        currentPrizeId = null;
        renderEditor();
      };
      box.appendChild(row);
    });
  }

  function collectEditor() {
    const rows = [...document.querySelectorAll('#prizeEditor .prize-edit-row')];
    prizes = rows.map((r, i) => ({
      id: 'p' + i,
      name: r.querySelector('.ename').value.trim() || ('奖项' + (i + 1)),
      quota: Math.max(0, parseInt(r.querySelector('.equota').value) || 0),
      drawn: 0 // 重新设置时重置已抽数量
    }));
  }

  $('addPrizeBtn').onclick = () => {
    collectEditor();
    prizes.push({ id: 'p' + prizes.length, name: '新奖项', quota: 1, drawn: 0 });
    currentPrizeId = null;
    renderEditor();
  };

  $('savePrizesBtn').onclick = () => {
    collectEditor();
    saveData();
    currentPrizeId = null;
    renderUI();
    $('modalOverlay').style.display = 'none';
  };

  $('resetBtn').onclick = () => {
    if (!confirm('确定要清空所有已抽奖项数量，并清空中奖名单吗？')) return;
    prizes.forEach(p => p.drawn = 0);
    winners = [];
    saveData();
    renderUI();
    $('modalOverlay').style.display = 'none';
  };

  // --- 启动 ---
  initSlots();
  resize();
  renderUI();
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
