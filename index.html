<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>幸运抽奖大屏</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#02050a;color:#eaf4ff;font-family:"Microsoft YaHei",sans-serif;overflow:hidden}

/* ---------- 大屏端样式 ---------- */
#screen{height:100vh;display:flex;flex-direction:column;position:relative;z-index:10}
header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid rgba(90,170,255,.15);background:rgba(8,20,40,.8);backdrop-filter:blur(10px)}
.brand{font-size:32px;font-weight:800;letter-spacing:4px;background:linear-gradient(90deg,#9fd8ff,#4fa8ff,#a0e0ff);-webkit-background-clip:text;color:transparent;text-shadow:0 0 20px rgba(90,170,255,.5)}
.header-right{display:flex;align-items:center;gap:20px}
.count{font-size:18px;color:#bfe0ff}
.count span{font-size:36px;font-weight:bold;color:#fff;margin:0 5px;text-shadow:0 0 15px #4fa8ff}
#showQrBtn{height:44px;padding:0 20px;border-radius:8px;background:linear-gradient(180deg,#8fd3ff,#3d9dff);color:#04101f;font-size:16px;font-weight:bold;cursor:pointer;border:none;box-shadow:0 4px 15px rgba(61,157,255,.4)}
#settingBtn{height:36px;padding:0 15px;border:1px solid rgba(120,190,255,.4);border-radius:8px;background:rgba(40,90,150,.3);color:#9fd8ff;font-size:14px;cursor:pointer}
#bgmBtn{height:36px;width:36px;border-radius:50%;border:1px solid rgba(120,190,255,.4);background:rgba(40,90,150,.3);color:#9fd8ff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}

main{flex:1;display:flex;min-height:0}
.left{width:280px;background:rgba(5,12,24,.85);padding:15px;border-right:1px solid rgba(90,170,255,.15);overflow-y:auto;backdrop-filter:blur(5px)}
.left h3{margin-bottom:15px;font-size:16px;text-align:center;color:#8fb8e0;letter-spacing:2px}
.winner-item{background:linear-gradient(90deg,rgba(20,40,70,.8),rgba(10,20,40,.4));padding:10px;margin-bottom:8px;border-radius:6px;border-left:3px solid #5db4ff;display:flex;justify-content:space-between;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.winner-item span{color:#8fb8e0}
.winner-item b{color:#ffd700}
.canvas-box{flex:1;position:relative;overflow:hidden;background:#02050a}
canvas{display:block;width:100%;height:100%}

/* 右侧操作区 */
.right{width:280px;background:rgba(5,12,24,.85);padding:20px;border-left:1px solid rgba(90,170,255,.15);display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(5px)}
.prize-btn{padding:14px;border-radius:8px;border:1px solid rgba(90,170,255,.2);background:rgba(15,30,55,.7);cursor:pointer;text-align:center;font-size:16px;font-weight:bold;transition:.3s;position:relative;overflow:hidden}
.prize-btn:not(.done):hover{border-color:#5db4ff;box-shadow:0 0 15px rgba(90,170,255,.4)}
.prize-btn.active{border-color:#ffd700;background:rgba(60,50,10,.6);box-shadow:0 0 20px rgba(255,215,0,.4);color:#ffd700}
.prize-btn.done{opacity:.3;cursor:not-allowed;filter:grayscale(1)}
.batch-row{display:flex;align-items:center;justify-content:space-between;font-size:15px;color:#bfe0ff;margin-top:10px;padding:10px 0;border-top:1px solid rgba(90,170,255,.2)}
.batch-row input{width:60px;height:34px;border-radius:6px;border:1px solid rgba(120,190,255,.3);background:#07111f;color:#fff;font-size:16px;text-align:center;outline:none}
.controls{display:flex;flex-direction:column;gap:12px;margin-top:auto}
.controls button{height:56px;border:none;border-radius:10px;font-size:20px;font-weight:bold;cursor:pointer;transition:.2s;letter-spacing:2px}
#startBtn{background:linear-gradient(180deg,#8fd3ff,#3d9dff);color:#04101f;box-shadow:0 0 20px rgba(61,157,255,.4)}
#startBtn:active{transform:scale(0.98)}
#stopBtn{background:linear-gradient(180deg,#ffb36b,#ff5e3d);color:#2a0500;box-shadow:0 0 20px rgba(255,94,61,.4)}
#stopBtn:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}

/* ---------- 放大二维码弹窗 ---------- */
#qrModal{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:200;cursor:pointer;backdrop-filter:blur(5px)}
.qr-container{background:#fff;padding:30px;border-radius:20px;box-shadow:0 0 80px rgba(90,170,255,.6);display:flex;flex-direction:column;align-items:center;animation:popIn .4s cubic-bezier(0.175, 0.885, 0.32, 1.275)}
@keyframes popIn{from{transform:scale(0.6);opacity:0}to{transform:scale(1);opacity:1}}
#bigQrcode img{width:360px;height:360px;display:block}
.qr-tips{margin-top:25px;font-size:28px;font-weight:900;color:#0f1a2e;letter-spacing:4px}
.qr-subtips{margin-top:40px;font-size:20px;color:#8fb8e0;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ---------- 手机登记页样式 ---------- */
#mobile{display:none;height:100vh;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 20%,#12305a,#05080f 70%)}
.card{width:100%;max-width:360px;background:#0f1a2e;border:1px solid rgba(100,180,255,.3);border-radius:16px;padding:30px 20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.card h2{margin-bottom:10px;color:#fff;font-size:24px}
.card p{color:#8fb8e0;font-size:14px;margin-bottom:25px}
.card input{width:100%;height:50px;margin-bottom:15px;border-radius:8px;border:1px solid rgba(120,190,255,.3);background:#07111f;color:#fff;font-size:16px;padding:0 15px;outline:none;transition:.2s}
.card input:focus{border-color:#5db4ff;box-shadow:0 0 10px rgba(90,170,255,.3)}
.card button{width:100%;height:50px;border:none;border-radius:8px;background:linear-gradient(180deg,#8fd3ff,#3d9dff);color:#04101f;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px}
.card button:disabled{opacity:.5}
#msg{margin-top:15px;font-size:14px;color:#9fe0a0;min-height:20px}

/* ---------- 设置弹窗 ---------- */
#modalOverlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(5px)}
#modal{width:500px;max-width:90vw;background:#0f1a2e;border:1px solid rgba(90,170,255,.3);border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid rgba(90,170,255,.2)}
.modal-header h3{margin:0;color:#fff;font-size:18px}
.close-btn{background:none;border:none;color:#8fb8e0;font-size:24px;cursor:pointer}
.prize-edit-row{display:flex;gap:10px;margin-bottom:10px;align-items:center}
.prize-edit-row input{height:38px;border-radius:6px;border:1px solid rgba(120,190,255,.3);background:#07111f;color:#fff;padding:0 10px;outline:none;font-size:14px}
.prize-edit-row .ename{flex:1}
.prize-edit-row .equota{width:80px}
.prize-edit-row .edel{width:38px;height:38px;border:none;border-radius:6px;background:rgba(120,40,40,.6);color:#ffbaba;cursor:pointer;font-size:20px;line-height:1}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions button{flex:1;height:42px;border:none;border-radius:6px;cursor:pointer;font-size:15px;font-weight:bold}
#addPrizeBtn{background:#2a5a8a;color:#fff}
#savePrizesBtn{background:linear-gradient(180deg,#8fd3ff,#3d9dff);color:#04101f}
#resetBtn{background:rgba(120,40,40,.6);color:#ffbaba;margin-top:10px;width:100%;height:38px;border:none;border-radius:6px;cursor:pointer;font-size:14px}
</style>
</head>
<body>

<!-- 背景音乐 -->
<audio id="bgm" src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8a73467.mp3" loop></audio>

<!-- 大屏界面 -->
<div id="screen">
  <header>
    <div class="brand">幸运抽奖</div>
    <div class="header-right">
      <div class="count">已参与 <span id="totalCount">0</span> 人</div>
      <button id="bgmBtn" title="背景音乐">🔊</button>
      <button id="showQrBtn">📱 扫码参与</button>
      <button id="settingBtn">⚙️ 设置奖项</button>
    </div>
  </header>
  <main>
    <div class="left">
      <h3>🏆 中奖名单</h3>
      <div id="winnerList"></div>
    </div>
    <div class="canvas-box">
      <canvas id="stage"></canvas>
    </div>
    <div class="right">
      <div id="prizeList"></div>
      <div class="batch-row">
        <span>本批揭晓</span>
        <input id="drawCount" type="number" value="1" min="1" max="50"> 人
      </div>
      <div class="controls">
        <button id="startBtn">开始抽奖</button>
        <button id="stopBtn" disabled>停止抽奖</button>
      </div>
    </div>
  </main>
</div>

<!-- 放大版二维码弹窗 -->
<div id="qrModal">
  <div class="qr-container">
    <div id="bigQrcode"></div>
    <div class="qr-tips">微信/浏览器 扫码参与</div>
  </div>
  <div class="qr-subtips">点击屏幕任意位置关闭</div>
</div>

<!-- 手机登记界面 -->
<div id="mobile">
  <div class="card">
    <h2>活动登记</h2>
    <p>请输入您的姓名参与抽奖</p>
    <input id="m_name" placeholder="请输入姓名（必填）" maxlength="15" autocomplete="off">
    <button id="m_submit">提交登记</button>
    <p id="msg"></p>
  </div>
</div>

<!-- 设置奖项弹窗 -->
<div id="modalOverlay">
  <div id="modal">
    <div class="modal-header">
      <h3>⚙️ 奖项设置</h3>
      <button class="close-btn" id="closeModal">&times;</button>
    </div>
    <div id="prizeEditor"></div>
    <div class="modal-actions">
      <button id="addPrizeBtn">＋ 添加奖项</button>
      <button id="savePrizesBtn">保存并生效</button>
    </div>
    <button id="resetBtn">重置所有中奖状态（清空已抽数量）</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const urlParams = new URLSearchParams(window.location.search);
const isJoinMode = urlParams.has('join'); 

// ======== 核心通信参数配置 ========
let roomId = '';
let ntfyTopic = '';

function initComm() {
  if (isJoinMode) {
    roomId = urlParams.get('join');
    ntfyTopic = 'lottery_sys_' + roomId;
  } else {
    roomId = urlParams.get('room');
    if (!roomId) {
      roomId = 'room_' + Math.random().toString(36).substring(2, 8);
      const newUrl = window.location.pathname + '?room=' + roomId;
      window.history.replaceState(null, '', newUrl);
    }
    ntfyTopic = 'lottery_sys_' + roomId;
  }

  if (!isJoinMode) {
    const ev = new EventSource(`https://ntfy.sh/${ntfyTopic}/sse`);
    ev.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        if (data.event === 'message' && data.message) {
          addParticipant(data.message);
        }
      } catch(err){}
    };
  }
}

// ======== 数据存储逻辑 ========
let participants = [];
let winners = [];
let prizes = [
  { id: "p0", name: "特等奖", quota: 1, drawn: 0 },
  { id: "p1", name: "一等奖", quota: 3, drawn: 0 },
  { id: "p2", name: "二等奖", quota: 10, drawn: 0 },
  { id: "p3", name: "三等奖", quota: 20, drawn: 0 }
];

function loadData() {
  try {
    const p = localStorage.getItem('lottery_participants');
    if (p) participants = JSON.parse(p);
    const w = localStorage.getItem('lottery_winners');
    if (w) winners = JSON.parse(w);
    const pr = localStorage.getItem('lottery_prizes');
    if (pr) prizes = JSON.parse(pr);
  } catch(e){}
}
function saveData() {
  try {
    localStorage.setItem('lottery_participants', JSON.stringify(participants));
    localStorage.setItem('lottery_winners', JSON.stringify(winners));
    localStorage.setItem('lottery_prizes', JSON.stringify(prizes));
  } catch(e){}
}

function addParticipant(name) {
  name = name.trim();
  if (!name) return false;
  if (participants.some(p => p.name === name)) return false;
  
  participants.push({ name, won: false });
  saveData();
  renderUI();
  return true;
}

// ======== 手机端逻辑 ========
if (isJoinMode) {
  document.getElementById('screen').style.display = 'none';
  document.getElementById('mobile').style.display = 'flex';
  initComm();

  $('m_submit').onclick = async () => {
    const name = $('m_name').value.trim();
    if (!name) {
      $('msg').style.color = '#ff9a9a';
      $('msg').textContent = '请输入姓名';
      return;
    }
    
    $('m_submit').disabled = true;
    $('m_submit').textContent = '提交中...';
    
    try {
      await fetch(`https://ntfy.sh/${ntfyTopic}`, { method: 'POST', body: name });
      $('msg').style.color = '#9fe0a0';
      $('msg').textContent = '登记成功！请关注大屏';
      $('m_name').value = '';
    } catch (e) {
      $('msg').style.color = '#ff9a9a';
      $('msg').textContent = '网络异常，请重试';
    } finally {
      setTimeout(() => {
        $('m_submit').disabled = false;
        $('m_submit').textContent = '提交登记';
      }, 2000);
    }
  };
} else {
  // ======== 大屏端逻辑 ========
  loadData();
  initComm();

  // 音乐控制
  const bgm = $('bgm');
  bgm.volume = 0.2; // 音量 20%
  let isBgmPlaying = false;
  $('bgmBtn').onclick = () => {
    if (isBgmPlaying) { bgm.pause(); $('bgmBtn').textContent = '🔇'; }
    else { bgm.play(); $('bgmBtn').textContent = '🔊'; }
    isBgmPlaying = !isBgmPlaying;
  };

  // 生成超大尺寸二维码
  const joinUrl = location.origin + location.pathname + '?join=' + roomId;
  new QRCode($("bigQrcode"), { text: joinUrl, width: 360, height: 360 });

  $('showQrBtn').onclick = () => $('qrModal').style.display = 'flex';
  $('qrModal').onclick = () => $('qrModal').style.display = 'none';

  // --- Canvas 3D 球体与粒子特效引擎 ---
  const canvas = $('stage');
  const ctx = canvas.getContext('2d');
  let W, H, cx, cy, R, dpr;
  let rotY = 0, speed = 0.2, targetSpeed = 0.2;
  let slots = [], flyers = [], sparks = []; // sparks 为爆炸粒子
  let state = 'idle'; 
  let currentPrizeId = null;
  let centerWinners = []; // 支持批量展示
  let showTimer = 0;
  
  const MAX = 400;

  function initSlots() {
    slots = [];
    for (let i = 0; i < MAX; i++) {
      const y = 1 - (i / (MAX - 1)) * 2;
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      const theta = Math.PI * (3 - Math.sqrt(5)) * i;
      slots.push({ bx: Math.cos(theta) * r, by: y, bz: Math.sin(theta) * r, name: null });
    }
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.scale(dpr, dpr);
    cx = W / 2; cy = H / 2; R = Math.min(W, H) * 0.38;
  }
  window.addEventListener('resize', resize);

  // 生成爆炸火花
  function createSparks(x, y, color = '#ffd700') {
    for (let i = 0; i < 80; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 8 + 2;
      sparks.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: Math.random() * 0.02 + 0.015,
        color: color
      });
    }
  }

  function update(dt, now) {
    speed += (targetSpeed - speed) * Math.min(1, dt * 2.2);
    rotY += speed * dt;

    // 更新粒子
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.life -= p.decay;
      if (p.life <= 0) sparks.splice(i, 1);
    }

    // 处理飞行动画
    for (let i = flyers.length - 1; i >= 0; i--) {
      const f = flyers[i];
      if (now < f.startAt) continue;
      const t = Math.min(1, (now - f.startAt) / f.duration);
      // 缓动函数（带一点回弹效果）
      const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      
      f.pos = {
        x: (1-e)*(1-e)*f.start.x + 2*(1-e)*e*f.cp.x + e*e*f.end.x,
        y: (1-e)*(1-e)*f.start.y + 2*(1-e)*e*f.cp.y + e*e*f.end.y
      };

      if (t >= 1 && !f.arrived) {
        f.arrived = true;
        centerWinners.push({ name: f.name, born: now, scale: 0 });
        createSparks(cx, cy); // 到达中心时爆炸
      }
    }
    flyers = flyers.filter(f => !f.arrived);

    // 处理中心名字的缩放缓冲
    centerWinners.forEach(w => {
      const age = (now - w.born) / 1000;
      if (age < 0.6) w.scale = age * 1.5; // 缓冲放大
      else w.scale = 0.9 + Math.sin((age - 0.6) * 5) * 0.05;
    });

    // 批量揭晓循环
    if (state === 'flying' && flyers.length === 0 && centerWinners.length > 0) {
      if (now - showTimer > 2500) { // 每个名字停留 2.5 秒
        centerWinners.shift(); 
        showTimer = now;
        if (centerWinners.length > 0) {
           // 如果有下一个，可以伴随小爆炸
           createSparks(cx, cy, '#8fd3ff');
        }
      }
    }

    if (state === 'flying' && flyers.length === 0 && centerWinners.length === 0) {
      state = 'idle';
      $('stopBtn').disabled = true;
      $('startBtn').disabled = false;
      renderPrizeList();
    }
  }

  function draw(now) {
    if (!W) return;
    ctx.clearRect(0, 0, W, H);
    
    // 背景光晕
    const bg = ctx.createRadialGradient(cx, cy, R*0.1, cx, cy, R*1.8);
    if (state === 'spinning') {
      const pulse = Math.abs(Math.sin(now / 150));
      bg.addColorStop(0, `rgba(50,120,220,${0.2 + pulse*0.1})`);
    } else if (state === 'flying') {
      bg.addColorStop(0, 'rgba(255,215,0,0.15)'); // 中奖时背景泛金
    } else {
      bg.addColorStop(0, 'rgba(30,70,130,0.15)');
    }
    bg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
    const cosX = Math.cos(-0.18), sinX = Math.sin(-0.18);
    const arr = [];
    
    let pool = participants.filter(p => !p.won);
    let displayNames = pool.length > 0 ? pool.map(p => p.name) : Array(30).fill("等待登记...");
    
    for (let i = 0; i < MAX; i++) {
      const s = slots[i];
      let x = s.bx * cosY - s.bz * sinY;
      let z = s.bx * sinY + s.bz * cosY;
      let y = s.by * cosX - z * sinX;
      z = s.by * sinX + z * cosX;
      
      const persp = 2.4 / (2.4 + z);
      arr.push({
        x: cx + x * R * persp,
        y: cy + y * R * persp,
        z: z,
        persp: persp,
        name: displayNames[i % displayNames.length] || null
      });
    }
    
    arr.sort((a, b) => a.z - b.z);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    // 绘制外圈光环
    ctx.beginPath();
    ctx.arc(cx, cy, R * 1.1, 0, Math.PI * 2);
    ctx.strokeStyle = state === 'spinning' ? 'rgba(90,170,255,0.4)' : 'rgba(90,170,255,0.1)';
    ctx.lineWidth = 2;
    ctx.stroke();

    for (const a of arr) {
      if (a.name) {
        const depth = (a.z + 1) / 2;
        const alpha = 0.1 + depth * 0.8;
        const size = 9 + a.persp * 9;
        ctx.font = `600 ${size.toFixed(1)}px "Microsoft YaHei"`;
        ctx.fillStyle = `rgba(190,225,255,${alpha})`;
        ctx.fillText(a.name, a.x, a.y);
      }
    }

    // 绘制飞行中的光球和拖尾
    for (const f of flyers) {
      if (f.pos) {
        const g = ctx.createRadialGradient(f.pos.x, f.pos.y, 0, f.pos.x, f.pos.y, 20);
        g.addColorStop(0, '#fff');
        g.addColorStop(0.5, '#8fd3ff');
        g.addColorStop(1, 'rgba(80,160,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(f.pos.x, f.pos.y, 20, 0, Math.PI*2);
        ctx.fill();
      }
    }

    // 绘制爆炸粒子
    for (const p of sparks) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 绘制中心中奖名字（金色，带光晕）
    if (centerWinners.length > 0) {
      const w = centerWinners[0];
      const age = (now - w.born) / 1000;
      const alpha = Math.min(1, age * 5); // 快速淡入
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(cx, cy);
      ctx.scale(w.scale, w.scale);
      
      ctx.font = '900 90px "Microsoft YaHei"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      // 描边加粗
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#fff';
      ctx.strokeText(w.name, 0, 0);
      
      // 金色渐变填充
      const grad = ctx.createLinearGradient(0, -50, 0, 50);
      grad.addColorStop(0, '#fff8b0');
      grad.addColorStop(0.5, '#ffd700');
      grad.addColorStop(1, '#ff8c00');
      ctx.fillStyle = grad;
      
      // 强发光
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 60;
      ctx.fillText(w.name, 0, 0);
      
      // 再次发光叠加
      ctx.shadowBlur = 20;
      ctx.fillText(w.name, 0, 0);
      
      ctx.restore();
    }
  }

  let lastTime = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt, now);
    draw(now);
    requestAnimationFrame(frame);
  }

  function renderUI() {
    $('totalCount').textContent = participants.length;
    renderPrizeList();
    renderWinners();
  }

  function renderPrizeList() {
    if (!currentPrizeId && prizes.length) currentPrizeId = prizes[0].id;
    $('prizeList').innerHTML = prizes.map(p => {
      const remain = p.quota - p.drawn;
      const isActive = p.id === currentPrizeId;
      const isDone = remain <= 0;
      return `<div class="prize-btn ${isActive?'active':''} ${isDone?'done':''}" 
                onclick="selectPrize('${p.id}')" ${isDone||state!=='idle'?'disabled':''}>
                ${p.name}<br><span style="font-size:12px;font-weight:normal">剩余 ${remain} / ${p.quota}</span>
              </div>`;
    }).join('');
  }

  window.selectPrize = (id) => {
    if (state !== 'idle') return;
    currentPrizeId = id;
    renderPrizeList();
  };

  function renderWinners() {
    $('winnerList').innerHTML = winners.map(w => 
      `<div class="winner-item"><span>${w.prize}</span><b>${w.name}</b></div>`
    ).join('') || '<div style="color:#6f8fb0;text-align:center;font-size:12px;margin-top:20px">暂无中奖记录</div>';
  }

  // --- 抽奖控制 ---
  $('startBtn').onclick = () => {
    if (state !== 'idle') return;
    
    // 首次点击自动播放 BGM
    if (!isBgmPlaying) { bgm.play().catch(e=>{}); isBgmPlaying = true; $('bgmBtn').textContent = '🔊'; }
    
    state = 'spinning';
    targetSpeed = 3.5;
    $('startBtn').disabled = true;
    $('stopBtn').disabled = false;
    centerWinners = []; // 清空上次结果
  };

  $('stopBtn').onclick = () => {
    if (state !== 'spinning') return;
    state = 'stopping';
    targetSpeed = 0.2;
    $('stopBtn').disabled = true;

    const prize = prizes.find(p => p.id === currentPrizeId);
    const pool = participants.filter(p => !p.won);
    
    if (!prize || pool.length === 0) {
      setTimeout(() => { state = 'idle'; $('startBtn').disabled = false; }, 1000);
      return;
    }

    // 获取要抽的人数（支持批量）
    let batch = parseInt($('drawCount').value) || 1;
    batch = Math.min(batch, prize.quota - prize.drawn, pool.length);
    
    if (batch <= 0) {
      setTimeout(() => { state = 'idle'; $('startBtn').disabled = false; }, 1000);
      return;
    }

    // 抽取多人
    const picked = [];
    const poolCopy = [...pool];
    for(let i=0; i<batch; i++){
      const idx = Math.floor(Math.random() * poolCopy.length);
      picked.push(poolCopy.splice(idx, 1)[0]);
    }
    
    // 更新数据
    picked.forEach((p, i) => {
      p.won = true;
      prize.drawn++;
      winners.push({ name: p.name, prize: prize.name });
    });
    saveData();
    renderUI();

    // 触发飞入动画
    const now = performance.now();
    showTimer = now;
    
    picked.forEach((p, index) => {
      flyers.push({
        name: p.name,
        start: { x: cx + (Math.random()-0.5)*W*0.8, y: cy + (Math.random()-0.5)*H*0.8 },
        end: { x: cx, y: cy },
        cp: { x: cx + (Math.random()-0.5)*W*0.4, y: cy + (Math.random()-0.5)*H*0.4 },
        startAt: now + 1000 + index * 150, // 错开出发时间
        duration: 2000, // 飞行时间加长，增强缓冲感
        arrived: false,
        pos: null
      });
    });
    
    state = 'flying';
  };

  // --- 设置弹窗逻辑 ---
  $('settingBtn').onclick = () => {
    if (state !== 'idle') return alert('请等待当前抽奖动画结束');
    renderEditor();
    $('modalOverlay').style.display = 'flex';
  };
  $('closeModal').onclick = () => $('modalOverlay').style.display = 'none';

  function renderEditor() {
    const box = $('prizeEditor');
    box.innerHTML = '';
    prizes.forEach((p, i) => {
      const row = document.createElement('div');
      row.className = 'prize-edit-row';
      row.innerHTML = `
        <input class="ename" value="${p.name}" placeholder="奖项名称">
        <input class="equota" type="number" min="0" value="${p.quota}" placeholder="数量">
        <button class="edel" title="删除">×</button>
      `;
      row.querySelector('.edel').onclick = () => {
        collectEditor();
        prizes.splice(i, 1);
        if (!prizes.length) prizes.push({ id: 'p0', name: '新奖项', quota: 1, drawn: 0 });
        currentPrizeId = null;
        renderEditor();
      };
      box.appendChild(row);
    });
  }

  function collectEditor() {
    const rows = [...document.querySelectorAll('#prizeEditor .prize-edit-row')];
    prizes = rows.map((r, i) => ({
      id: 'p' + i,
      name: r.querySelector('.ename').value.trim() || ('奖项' + (i + 1)),
      quota: Math.max(0, parseInt(r.querySelector('.equota').value) || 0),
      drawn: 0
    }));
  }

  $('addPrizeBtn').onclick = () => {
    collectEditor();
    prizes.push({ id: 'p' + prizes.length, name: '新奖项', quota: 1, drawn: 0 });
    currentPrizeId = null;
    renderEditor();
  };

  $('savePrizesBtn').onclick = () => {
    collectEditor();
    saveData();
    currentPrizeId = null;
    renderUI();
    $('modalOverlay').style.display = 'none';
  };

  $('resetBtn').onclick = () => {
    if (!confirm('确定要清空所有已抽奖项数量，并清空中奖名单吗？')) return;
    prizes.forEach(p => p.drawn = 0);
    winners = [];
    saveData();
    renderUI();
    $('modalOverlay').style.display = 'none';
  };

  // 启动
  initSlots();
  resize();
  renderUI();
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
